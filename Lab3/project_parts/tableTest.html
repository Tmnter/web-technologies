<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Таблиця</title>
</head>
<body>

<!-- ЗОВНІШНЯ ТАБЛИЦЯ (Рівень 1) -->
<table border="2" bordercolor="black" cellpadding="0" cellspacing="0">
    <tr>
        <td colspan="3" bgcolor="#40E0D0" height="40">&nbsp;</td>
    </tr>
    <tr>
        <td bgcolor="#FFFDD0" width="40">&nbsp;</td>

        <!-- СЕРЕДНЯ ТАБЛИЦЯ (Рівень 2) -->
        <td>
            <table border="2" bordercolor="black" cellpadding="0" cellspacing="0">
                <tr>
                    <td colspan="3" bgcolor="#40E0D0" height="40">&nbsp;</td>
                </tr>
                <tr>
                    <td bgcolor="#FFFDD0" width="40">&nbsp;</td>

                    <!-- ВНУТРІШНЯ ТАБЛИЦЯ (Рівень 3) -->
                    <td>
                        <table border="2" bordercolor="black" cellpadding="0" cellspacing="0">
                            <tr>
                                <td colspan="3" bgcolor="#40E0D0" height="40">&nbsp;</td>
                            </tr>
                            <tr>
                                <td bgcolor="#FFFDD0" width="40">&nbsp;</td>

                                <!-- ЦЕНТРАЛЬНИЙ КВАДРАТ 2х2 -->
                                <td>
                                    <table border="2" bordercolor="black" cellpadding="0" cellspacing="0">
                                        <tr>
                                            <td bgcolor="red" width="40" height="40"></td>
                                            <td bgcolor="blue" width="40" height="40"></td>
                                        </tr>
                                        <tr>
                                            <td bgcolor="#00FF00" width="40" height="40"></td>
                                            <td bgcolor="yellow" width="40" height="40"></td>
                                        </tr>
                                    </table>
                                </td>

                                <td bgcolor="#FFFDD0" width="40">&nbsp;</td>
                            </tr>
                            <tr>
                                <td colspan="3" bgcolor="#40E0D0" height="40">&nbsp;</td>
                            </tr>
                        </table>
                    </td>

                    <td bgcolor="#FFFDD0" width="40">&nbsp;</td>
                </tr>
                <tr>
                    <td colspan="3" bgcolor="#40E0D0" height="40">&nbsp;</td>
                </tr>
            </table>
        </td>

        <td bgcolor="#FFFDD0" width="40">&nbsp;</td>
    </tr>
    <tr>
        <td colspan="3" bgcolor="#40E0D0" height="40">&nbsp;</td>
    </tr>
</table>

</body>
</html>
